version: '3.8'

services:
  db:
    image: postgres:15
    container_name: nationalid-postgres
    environment:
      POSTGRES_DB: nationalid_db
      POSTGRES_USER: nationalid_user
      POSTGRES_PASSWORD: nationalid_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # test: ["CMD", "pg_isready", "-U", "nationalid_user"]
      test: ["CMD-SHELL", "pg_isready -U nationalid_user -d nationalid_db"]
      interval: 5s
      retries: 5

  api:
    build: .
    container_name: nationalid-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME:
      DB_USER:
      DB_PASSWORD:
      DB_HOST:
      DB_PORT:

volumes:
  postgres_data:

