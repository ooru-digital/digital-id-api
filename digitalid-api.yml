apiVersion: apps/v1
kind: Deployment
metadata:
  name: digitalid-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digitalid-backend
  template:
    metadata:
      labels:
        app: digitalid-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for Postgres..."; sleep 2; done']
      containers:
        - name: digitalid-backend
          image: digitalid-api:0.2
          command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
          ports:
            - containerPort: 8000
          env:
            - name: DB_NAME
              value: nationalid_db
            - name: DB_USER
              value: nationalid_user
            - name: DB_PASSWORD
              value: nationalid_pass
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"

---
apiVersion: v1
kind: Service
metadata:
  name: digitalid-backend-service
spec:
  type: NodePort
  selector:
    app: digitalid-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080

